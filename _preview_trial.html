<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><style>
  :root{
    --bg:#0b0d0e;
    --bg2:#121517;
    --line:#262b2e;
    --tx:#f2f2f0;
    --tx2:#9aa2a6;
    --accent:#e8e8e6;
    --green:#00c2a8;
    --gold:#d4af37;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);color:var(--tx);
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    line-height:1.7;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}
  section{padding:88px 0}
  .kicker{font-size:13px;letter-spacing:4px;color:var(--green);text-transform:uppercase;margin-bottom:14px}
  h2{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:1px;margin-bottom:10px}
  .sub{color:var(--tx2);font-size:16px;max-width:640px}
  .divider{height:1px;background:var(--line);border:0;margin:0}
  /* ===== header ===== */
  header{
    position:sticky;top:0;z-index:50;background:rgba(11,13,14,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;height:68px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{width:40px;height:40px;border-radius:50%}
  .brand-name{font-weight:800;letter-spacing:2px;font-size:16px}
  .brand-name small{display:block;font-size:10px;letter-spacing:3px;color:var(--tx2);font-weight:500}
  .nav-links{display:none;gap:26px;font-size:14px;color:var(--tx2)}
  .nav-links a:hover{color:#fff}
  .nav-toggle{display:flex;flex-direction:column;justify-content:center;gap:5px;width:42px;height:42px;padding:9px;cursor:pointer;border:1px solid var(--line);border-radius:8px;background:none}
  .nav-toggle span{display:block;height:2px;background:var(--tx);border-radius:2px;transition:transform .2s,opacity .2s}
  .nav.open .nav-toggle span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .nav.open .nav-toggle span:nth-child(2){opacity:0}
  .nav.open .nav-toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  @media(min-width:768px){.nav-links{display:flex}.nav-toggle{display:none}}
  @media(max-width:767px){
    .nav-links{position:absolute;top:68px;left:0;right:0;flex-direction:column;gap:0;background:rgba(11,13,14,.97);border-bottom:1px solid var(--line);padding:6px 18px 12px;max-height:0;overflow:hidden;transition:max-height .3s ease}
    .nav.open .nav-links{display:flex;max-height:460px}
    .nav-links a{padding:13px 4px;border-bottom:1px solid var(--line);font-size:17px;letter-spacing:1px}
    .nav-links a:last-child{border-bottom:0}
  }
  /* ===== hero ===== */
  .hero{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:74vh;padding:120px 0 80px}
  .hero .logo-big{width:120px;height:120px;border-radius:50%;margin-bottom:36px}
  .hero h1{font-size:clamp(38px,8vw,84px);font-weight:900;letter-spacing:4px;line-height:1.15}
  .hero h1 .dot{color:var(--green)}
  .hero .tag{font-size:clamp(15px,2vw,19px);color:var(--tx2);margin-top:18px;letter-spacing:2px}
  .hero .slogan{margin-top:34px;font-size:16px;color:var(--tx);letter-spacing:1px;font-weight:600}
  .hero .slogan b{color:var(--green)}
  .cta-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:44px}
  .btn{padding:14px 30px;border-radius:999px;font-size:15px;font-weight:700;letter-spacing:1px;display:inline-block}
  .btn-solid{background:#fff;color:#0b0d0e}
  .btn-solid:hover{background:var(--green);color:#0b0d0e}
  .btn-ghost{border:1px solid var(--line);color:var(--tx2)}
  .btn-ghost:hover{border-color:var(--tx);color:#fff}
  .btn-trial{border:1px solid var(--green);color:var(--green)}
  .btn-trial:hover{background:var(--green);color:#0b0d0e}
  .btn-formal{background:#0b0d0e;color:#fff;border:1px solid #0b0d0e}
  .btn-formal:hover{background:var(--gold);color:#0b0d0e;border-color:var(--gold)}
  .btn-trial-solid{background:var(--green);color:#0b0d0e;border:1px solid var(--green)}
  .btn-trial-solid:hover{background:#00a98f;color:#0b0d0e}
  .cta-box{border:1px solid var(--line);border-radius:14px;background:#fff;padding:28px 26px}
  .cta-box .tt{color:#0b0d0e;font-size:17px;font-weight:800;letter-spacing:1px;text-align:center}
  .cta-box .tt-sub{font-size:13px;color:#5b6368;letter-spacing:1px;text-align:center;margin-top:4px}
  .cta-duo{display:grid;grid-template-columns:1fr;gap:18px;margin-top:22px}
  @media(min-width:640px){.cta-duo{grid-template-columns:1fr 1fr}}
  .cta-card{display:flex;flex-direction:column;gap:10px}
  .cta-card .btn{width:100%;text-align:center}
  .cta-card p{font-size:12.5px;color:#5b6368;line-height:1.7;letter-spacing:1px}
  /* ===== three words ===== */
  .three{background:var(--bg2)}
  .cards{display:grid;grid-template-columns:1fr;gap:16px;margin-top:40px}
  @media(min-width:768px){.cards{grid-template-columns:repeat(3,1fr)}}
  .card{border:1px solid var(--line);border-radius:14px;padding:30px 26px;background:var(--bg)}
  .card .en{font-size:22px;font-weight:800;letter-spacing:2px}
  .card .zh{font-size:13px;color:var(--green);letter-spacing:3px;margin:4px 0 12px}
  .card p{color:var(--tx2);font-size:14px}
  .card .num{font-size:12px;color:#4a5156;letter-spacing:2px;margin-bottom:10px}
  /* ===== coach ===== */
  .coach-grid{display:grid;grid-template-columns:1fr;gap:40px;margin-top:44px;align-items:center}
  @media(min-width:768px){.coach-grid{grid-template-columns:300px 1fr}}
  .coach-avatar{width:260px;height:260px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);overflow:hidden;flex-shrink:0;justify-self:center}
  .coach-avatar img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
  .coach-info h3{font-size:26px;font-weight:800;letter-spacing:1px}
  .coach-info .role{color:var(--green);font-size:14px;letter-spacing:2px;margin:6px 0 18px}
  .coach-info p{color:var(--tx2);font-size:15px;margin-bottom:12px}
  .stats{display:flex;flex-wrap:wrap;gap:26px;margin-top:22px}
  .stat b{display:block;font-size:26px;font-weight:800;color:#fff}
  .stat span{font-size:12px;color:var(--tx2);letter-spacing:1px}
  /* 賽事名次牆（僅列分組名次，不列成績與總排名） */
  .races{margin-top:26px}
  .races .rt{font-size:12px;letter-spacing:2px;color:var(--green);margin-bottom:8px}
  .races .row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
  .races .rk{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#0b0d0e}
  .races .rk.g{background:#d4af37;color:#0b0d0e}
  .races .rk.s{background:#c3c7cb;color:#0b0d0e}
  .races .rk.b{background:#a5642f;color:#fff}
  .races .rk.n{background:#41484c;color:#fff}
  .races .nm{font-size:15px;color:#fff;font-weight:700;flex:1 1 auto;min-width:0}
  .races .dt{font-size:12.5px;color:var(--tx2);letter-spacing:.5px;flex:0 0 auto}
  .races .note{font-size:11.5px;color:var(--tx2);margin-top:8px;opacity:.85}
  @media(max-width:520px){.races .dt{display:none}}
  /* BQ 年度分布 */
  .bq{margin-top:24px}
  .bq .rt{font-size:12px;letter-spacing:2px;color:var(--green);margin-bottom:10px}
  .bq .bars{display:flex;gap:10px;align-items:flex-end}
  .bq .col{flex:1;text-align:center;min-width:0}
  .bq .col .c{font-size:12px;font-weight:700;color:#fff}
  .bq .col .bar{height:54px;display:flex;align-items:flex-end;justify-content:center;margin-top:3px}
  .bq .col .bar i{display:block;width:26px;margin:0 auto;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--green),#00786e)}
  .bq .col .y{display:block;font-size:11px;color:var(--tx2);margin-top:5px;letter-spacing:.5px}
  .bq .note{font-size:11.5px;color:var(--tx2);margin-top:8px;opacity:.85}
  /* 大滿貫星圖：上排賽事名稱，下方星星＝參賽場次 */
  .majors{margin-top:26px}
  .majors .rt{font-size:12px;letter-spacing:2px;color:var(--green);margin-bottom:10px}
  .majors .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media(min-width:768px){.majors .grid{grid-template-columns:repeat(8,1fr)}}
  .majors .cell{border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;background:rgba(255,255,255,.02)}
  .majors .cell b{display:block;font-size:12.5px;color:#fff;font-weight:700;letter-spacing:.5px}
  .majors .cell .st{display:block;font-size:11.5px;color:var(--gold);margin-top:7px;letter-spacing:1px;line-height:1.4;word-break:break-all}
  .majors .cell.todo{border-style:dashed;background:transparent}
  .majors .cell.todo b{color:var(--tx2)}
  .majors .cell.todo .st{color:var(--tx2);font-size:11px;letter-spacing:2px}
  .majors .note{font-size:11.5px;color:var(--tx2);margin-top:10px;opacity:.85}
  /* ===== achievement gallery ===== */
  .achieve{display:grid;grid-template-columns:1fr;gap:18px;margin-top:44px}
  @media(min-width:768px){.achieve{grid-template-columns:1.2fr 1fr 1fr}}
  .achieve-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg2)}
  .achieve-card .ph{height:220px;overflow:hidden}
  .achieve-card .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .achieve-card.first .ph{height:260px}
  .achieve-card .cap{padding:14px 16px 16px}
  .achieve-card .cap b{display:block;font-size:14px;color:#fff;letter-spacing:1px;margin-bottom:4px}
  .achieve-card .cap span{font-size:12.5px;color:var(--tx2);line-height:1.6}
  /* ===== age grading ===== */
  .ag{background:var(--bg2)}
  .ag-grid{display:grid;grid-template-columns:1fr;gap:20px;margin-top:40px}
  @media(min-width:900px){.ag-grid{grid-template-columns:1.1fr .9fr}}
  .ag-card{border:1px solid var(--line);border-radius:16px;background:var(--bg);padding:30px 28px}
  .ag-card h4{font-size:15px;letter-spacing:2px;font-weight:800;margin-bottom:18px;color:var(--tx)}
  .formulas{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:26px}
  @media(min-width:640px){.formulas{grid-template-columns:repeat(3,1fr)}}
  .formula{border:1px solid var(--line);border-radius:12px;padding:18px 16px;background:var(--bg2)}
  .formula .f-en{font-size:11px;letter-spacing:2px;color:var(--green);margin-bottom:6px;text-transform:uppercase}
  .formula .f-num{font-size:15px;font-weight:700;color:#fff;line-height:1.5}
  .formula p{font-size:12px;color:var(--tx2);margin-top:8px;line-height:1.6}
  .grade-ladder{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 4px}
  .grade-chip{font-size:12px;letter-spacing:1px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--tx2)}
  .grade-chip b{color:#fff}
  .highlight{border:1px solid rgba(212,175,55,.45);background:linear-gradient(180deg,rgba(212,175,55,.08),rgba(212,175,55,0) 60%),var(--bg)}
  .highlight .ag-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:6px}
  .highlight .ag-stats .ag-stat{border-top:1px solid var(--line);padding-top:12px}
  .highlight .ag-stats .ag-stat b{display:block;font-size:20px;font-weight:800;color:#fff}
  .highlight .ag-stats .ag-stat.gold b{color:var(--gold)}
  .highlight .ag-stats .ag-stat.green b{color:var(--green)}
  .highlight .ag-stats .ag-stat span{font-size:11px;color:var(--tx2);letter-spacing:1px}
  .ag-note{font-size:12px;color:#5b6368;margin-top:18px;line-height:1.6}
  /* ===== calculator ===== */
  .calc label{display:block;font-size:12px;letter-spacing:1px;color:var(--tx2);margin:16px 0 6px}
  .calc label:first-child{margin-top:0}
  .seg{display:flex;gap:8px}
  .seg-btn{flex:1;padding:10px 0;text-align:center;border-radius:10px;border:1px solid var(--line);font-size:14px;letter-spacing:2px;color:var(--tx2);cursor:pointer;transition:all .15s}
  .seg-btn.on{background:var(--green);border-color:var(--green);color:#0b0d0e;font-weight:800}
  .calc-row{display:flex;gap:10px;align-items:flex-end}
  .calc-field{flex:1}
  .calc-field input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font-size:18px;font-weight:700;text-align:center;outline:none;font-family:inherit}
  .calc-field input:focus{border-color:var(--green)}
  .calc-field span{display:block;font-size:11px;color:var(--tx2);text-align:center;margin-top:4px;letter-spacing:1px}
  .calc-result{margin-top:22px;border:1px solid var(--line);border-radius:14px;padding:20px 18px;background:var(--bg2)}
  .calc-result .out{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding:9px 0}
  .calc-result .out:last-child{border-bottom:0}
  .calc-result .out .k{font-size:13px;color:var(--tx2)}
  .calc-result .out .v{font-size:20px;font-weight:800;color:#fff;letter-spacing:1px}
  .calc-result .out .v.green{color:var(--green)}
  .calc-result .out .v.gold{color:var(--gold)}
  .calc-result .grade-msg{font-size:13px;color:var(--tx2);margin-top:10px;line-height:1.7}
  .calc-result .grade-msg b{color:#fff}
  .calc-foot{font-size:11px;color:#5b6368;margin-top:14px;line-height:1.7}
  /* ===== courses ===== */
  .courses .cards{grid-template-columns:1fr}
  @media(min-width:768px){.courses .cards{grid-template-columns:repeat(3,1fr)}}
  .course-icon{width:46px;height:46px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  .course-icon svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.6}
  .course-toggle{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:13px;letter-spacing:1px;color:var(--green);cursor:pointer;user-select:none}
  .course-toggle .arrow{display:inline-block;transition:transform .2s;font-size:11px}
  .card.open .course-toggle .arrow{transform:rotate(180deg)}
  .course-detail{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .card.open .course-detail{max-height:1200px}
  .course-detail-inner{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .course-detail-inner p{color:var(--tx2);font-size:14px;line-height:1.8;margin-bottom:8px}
  .course-detail-inner p:last-child{margin-bottom:0}
  .course-detail-inner b{color:#fff}
  .fee-note{display:flex;gap:16px;align-items:flex-start;margin-top:26px;border:1px dashed var(--line);border-radius:14px;padding:22px 26px;background:var(--bg2)}
  .fee-note .fee-icon{width:40px;height:40px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .fee-note .fee-icon svg{width:20px;height:20px;stroke:var(--green);fill:none;stroke-width:1.6}
  .fee-note b{font-size:15px;letter-spacing:1px}
  .fee-note p{color:var(--tx2);font-size:13.5px;line-height:1.8;margin-top:6px}
  /* ===== method ===== */
  .method{background:var(--bg2)}
  .method-list{display:grid;grid-template-columns:1fr;gap:14px;margin-top:40px}
  @media(min-width:768px){.method-list{grid-template-columns:repeat(2,1fr)}}
  .m-item{display:flex;gap:16px;border:1px solid var(--line);border-radius:12px;padding:22px;background:var(--bg)}
  .m-item svg{width:20px;height:20px;stroke:var(--green);fill:none;stroke-width:1.8;flex-shrink:0;margin-top:4px}
  .m-item b{display:block;font-size:15px;margin-bottom:4px;letter-spacing:1px}
  .m-item p{color:var(--tx2);font-size:13px}
  /* ===== testimonials ===== */
  .t-list{display:grid;grid-template-columns:1fr;gap:16px;margin-top:40px}
  @media(min-width:768px){.t-list{grid-template-columns:repeat(2,1fr)}}
  .t-card{border:1px solid var(--line);border-radius:14px;padding:26px;background:var(--bg)}
  .t-card .quote{font-size:15px;color:var(--tx);margin-bottom:16px}
  .t-card .who{font-size:13px;color:var(--tx2);letter-spacing:1px}
  .t-card .who b{color:var(--tx)}
  .placeholder-note{font-size:12px;color:#5b6368;border:1px dashed #3a4043;border-radius:10px;padding:10px 14px;margin-top:20px}
  /* ===== contact ===== */
  .contact{background:var(--bg2)}
  .contact-grid{display:grid;grid-template-columns:1fr;gap:36px;margin-top:44px}
  @media(min-width:768px){.contact-grid{grid-template-columns:1.2fr .8fr}}
  .contact-item{display:flex;gap:14px;align-items:center;margin-bottom:20px}
  .contact-item svg{width:20px;height:20px;stroke:var(--green);fill:none;stroke-width:1.8;flex-shrink:0}
  .contact-item b{display:block;font-size:14px}
  .contact-item span{color:var(--tx2);font-size:14px}
  .qr-box{border:1px dashed #3a4043;border-radius:14px;padding:34px;text-align:center;color:#5b6368;font-size:14px;display:flex;align-items:center;justify-content:center;min-height:200px;letter-spacing:1px}
  /* ===== footer ===== */
  footer{border-top:1px solid var(--line);padding:52px 0 40px}
  .footer-brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .footer-brand img{width:44px;height:44px;border-radius:50%}
  .footer-brand .name{font-weight:800;letter-spacing:2px}
  .footer-brand .name small{display:block;font-size:10px;letter-spacing:3px;color:var(--tx2);font-weight:500}
  footer .slogan{color:var(--tx2);font-size:14px;letter-spacing:1px}
  footer .slogan b{color:var(--tx)}
  footer .copy{margin-top:24px;font-size:12px;color:#4a5156}
  /* ===== 手機版字體與間距放大 ===== */
  @media(max-width:767px){
    html{font-size:18px}
    body{font-size:18px;line-height:1.8}
    .wrap{padding:0 18px}
    section{padding:60px 0}
    .kicker{font-size:13px;letter-spacing:3px;margin-bottom:10px}
    h2{font-size:28px;margin-bottom:10px;letter-spacing:1px}
    .sub{font-size:17px;line-height:1.85}
    .hero{min-height:auto;padding:80px 0 56px}
    .hero .logo-big{width:100px;height:100px;margin-bottom:24px}
    .hero h1{font-size:56px;letter-spacing:3px}
    .hero .tag{font-size:16px;letter-spacing:1px;margin-top:14px}
    .hero .slogan{font-size:16px;margin-top:24px}
    .cta-row{margin-top:32px;gap:8px;flex-wrap:nowrap}
    .btn{padding:10px 14px;font-size:13px;letter-spacing:0.5px;white-space:nowrap}
    .card{padding:26px 22px}
    .card .en{font-size:20px}
    .card .zh{font-size:14px;margin:4px 0 10px}
    .card p{font-size:16px;line-height:1.8}
    .coach-grid{gap:28px;margin-top:28px}
    .coach-avatar{width:200px;height:200px}
    .coach-info h3{font-size:24px}
    .coach-info .role{font-size:14px;margin:6px 0 14px}
    .coach-info p{font-size:17px;margin-bottom:14px;line-height:1.85}
    .stats{gap:22px;margin-top:18px}
    .stat b{font-size:24px}
    .stat span{font-size:13px}
    .achieve{gap:14px;margin-top:28px}
    .achieve-card .ph{height:220px}
    .achieve-card .ph img{object-position:center 25%}
    .achieve-card.first .ph{height:260px}
    .achieve-card.first .ph img{object-position:center}
    .achieve-card .cap{padding:14px 16px 16px}
    .achieve-card .cap b{font-size:16px}
    .achieve-card .cap span{font-size:14.5px;line-height:1.75}
    .ag-card{padding:26px 22px}
    .ag-card h4{font-size:17px;margin-bottom:14px}
    .formula{padding:18px 16px}
    .formula .f-en{font-size:12px}
    .formula .f-num{font-size:16px}
    .formula p{font-size:14px;line-height:1.75;margin-top:8px}
    .grade-chip{font-size:13px;padding:7px 14px}
    .highlight .ag-stats{gap:12px}
